# Raccoon 单容器部署：一个应用容器、一个 Web 端口、持久化数据 + 下载两个卷。
# network_mode 显式 bridge：容器接入默认网桥，宿主机反代（Nginx Proxy Manager 等）经 127.0.0.1:8530 访问不断链。
# 镜像发布在 Docker Hub（fooololo/raccoon-server）；本地开发/自建走 build。
#
# 镜像 tag 用 latest（2026-10-25 裁决）：不随发版改这个文件——
# 更新 = docker compose pull && docker compose up -d；
# 需要钉版本自行替换 tag（生产建议，见 docs/17 §5）。
services:
  raccoon:
    build:
      context: .
      # 版本号不在 compose 里维护（发版由 make docker-release VERSION=x.y.z 传入）。
      # 引擎版本与 Dockerfile ARG 默认值保持一致（docs/02 §8：升级引擎 = 升级镜像）。
      args:
        YTDLP_VERSION: "2026.10.21"
        CURLCFFI_VERSION: "0.16.3"
    image: fooololo/raccoon-server:1.0.8
    container_name: raccoon
    network_mode: bridge
    ports:
      - "8530:8530"
    volumes:
      - ./data:/data                # 数据库/配置/凭据/日志（唯一必需挂载）
      - ./downloads:/downloads      # 下载文件（镜像内 env 锁定 RACCOON_DOWNLOAD_DIR=/downloads）
      - ./media:/media              # 可选：已有 NAS 媒体库；要用它当下载目录时，在 environment 里设 RACCOON_DOWNLOAD_DIR=/media
    environment:
      TZ: Asia/Shanghai
      # RACCOON_SERVER_ADDR: ":8530"   # 启动级设置（改动需重启，界面只读标注）
      # RACCOON_DATA_DIR: "/data"
      # RACCOON_DOWNLOAD_DIR: "/downloads"  # 下载目录默认已由镜像锁定为 /downloads；换路径改这里并同步挂载
      # RACCOON_AUTH_DISABLED: "true"  # 免登录模式：打开即用（仅限隔离内网——任何能访问 8530 的人都有全部权限）
    restart: unless-stopped
