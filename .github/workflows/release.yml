name: Release

# 发布流水线：推 v* 标签（或手动触发填版本号）→ 先跑全部测试 →
# 双架构构建 → 两个并行 job 分别推 Docker Hub 与 GHCR（互不拖累：
# 一个仓库故障/限流不影响另一个的发布，日志也各自独立可重跑）。
# 版本号写入镜像内 server.version（Dockerfile ARG VERSION）。
#
# 所需仓库 secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 账号（fooololo）
#   DOCKERHUB_TOKEN     Docker Hub 的 Access Token（hub.docker.com → Account Settings → Security）
# GHCR 用内置 GITHUB_TOKEN，无需额外配置。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.0.1，不带 v 前缀）"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # ---- 发布前置：与 CI 完全同口径的测试门禁（测试不绿不出镜像）----
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum
      - run: go build -buildvcs=false ./...
      - run: go vet -buildvcs=false ./...
      - run: go test -buildvcs=false -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-design-conformance.py

  # ---- 双架构构建 → 推 Docker Hub ----
  publish-dockerhub:
    needs: [backend, web, design]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          case "$V" in
            ''|*[!0-9A-Za-z._-]*) echo "非法版本号: $V"; exit 1;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: |
            fooololo/raccoon-server:${{ steps.ver.outputs.version }}
            fooololo/raccoon-server:latest
          # 固定 scope：跨版本复用同一个缓存条目。
          # 不写 scope 时缓存按当前 ref（本次是 tag）分域——每个新 tag 都是
          # 一份全新缓存，发版永远冷启动，几百 MB 依赖每次重下。
          cache-from: type=gha,scope=raccoon-build
          cache-to: type=gha,mode=max,scope=raccoon-build

      - name: 发布摘要
        run: |
          echo "## Docker Hub 发布完成 🦝" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`fooololo/raccoon-server:${{ steps.ver.outputs.version }}\`（latest 已同步指向）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构：linux/amd64 + linux/arm64" >> "$GITHUB_STEP_SUMMARY"

  # ---- 双架构构建 → 推 GHCR（与 Docker Hub 并行，互不依赖）----
  publish-ghcr:
    needs: [backend, web, design]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          case "$V" in
            ''|*[!0-9A-Za-z._-]*) echo "非法版本号: $V"; exit 1;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/huluohu/raccoon-server:${{ steps.ver.outputs.version }}
            ghcr.io/huluohu/raccoon-server:latest
          # 固定 scope：跨版本复用同一个缓存条目。
          # 不写 scope 时缓存按当前 ref（本次是 tag）分域——每个新 tag 都是
          # 一份全新缓存，发版永远冷启动，几百 MB 依赖每次重下。
          cache-from: type=gha,scope=raccoon-build
          cache-to: type=gha,mode=max,scope=raccoon-build

      - name: 发布摘要
        run: |
          echo "## GHCR 发布完成 🦝" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/huluohu/raccoon-server:${{ steps.ver.outputs.version }}\`（latest 已同步指向）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构：linux/amd64 + linux/arm64" >> "$GITHUB_STEP_SUMMARY"
