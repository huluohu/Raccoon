name: CI

# 质量门禁（与本地 make verify 同口径）：后端 / 前端 / 设计符合度 / 镜像可构建。
# 只做验证不发布——发布（Docker Hub + GHCR）走 release.yml 的 tag 流水线。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---- 后端：gofmt / vet / 编译 / 全量单测 ----
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum
      - name: gofmt 检查
        run: test -z "$(gofmt -l .)" || (echo "gofmt 未通过：" && gofmt -l . && exit 1)
      - name: Build
        run: go build -buildvcs=false ./...
      - name: Vet
        run: go vet -buildvcs=false ./...
      - name: Test
        run: go test -buildvcs=false -count=1 ./...

  # ---- 前端：typecheck + 构建 + vitest ----
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck + Build
        run: npm run build
      - name: Vitest
        run: npm test

  # ---- 设计符合度对账（docs/07 §2 Token / §3 路由 / §4 组件 / §7 交互）----
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设计符合度对账
        run: python3 scripts/check-design-conformance.py

  # ---- 镜像可构建（amd64，只验证不推送）----
  docker:
    needs: [backend, web, design]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build（不出产物）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
